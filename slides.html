  <script id="deck-data" type="application/json">{"slides":[{"chapter":"Opening","chapterlabel":"","content":"\u003ch1>Automatic\u003cbr>\u003cspan class=\"accent\">Splitting\u003c/span> of\u003cbr>Translation Units\u003c/h1>\u003cp class=\"lead\">Compiler-Agnostic Compiler Frontend Parallelization\u003c/p>","eyebrow":"CppCon 2026 · Damien Buhl","layout":"","notes":"Talk scope: compiler frontend parallelization. The implementation has a PCH for the current architecture; this is not a claim that C++ modules are implemented."},{"chapter":"Opening","chapterlabel":"","content":"\u003ch2>Damien Buhl · \u003cspan class=\"accent\">daminetreg\u003c/span>\u003c/h2>\u003cp class=\"lead\">Co-founder of \u003cstrong>tipi.build\u003c/strong> by EngFlow.\u003c/p>\u003cdiv class=\"grid three\">\u003cdiv class=\"card \" >\u003ch3 class=\"teal\">Builds too slow?\u003c/h3>\u003cp>Remote execution and caching for C++ builds — CMake and Bazel — on your own cluster or ours.\u003c/p>\u003c/div>\u003cdiv class=\"card \" >\u003ch3 class=\"violet\">Reproducible builds?\u003c/h3>\u003cp>Hermetic, container-defined toolchains, so every build has the same answer on every machine.\u003c/p>\u003c/div>\u003cdiv class=\"card \" >\u003ch3 class=\"split\">Modernizing your builds?\u003c/h3>\u003cp>Moving to CMake or Bazel without stopping the team: let's talk.\u003c/p>\u003c/div>\u003c/div>","eyebrow":"About me","layout":"","notes":"Who is talking. Co-founder of tipi.build, now part of EngFlow — the reproducible, cached, remote build layer for CMake and Bazel that the benchmarks later run on. Three reasons to come and talk afterwards."},{"chapter":"Opening","chapterlabel":"Translation Unit (TU) Fission","content":"\u003ch2>\u003cspan class=\"split\">TU fission\u003c/span> : splitting the \u003cspan class=\"violet\">atom\u003c/span> of builds.\u003c/h2>\u003cdiv class=\"fission\">\u003cdiv class=\"atom\">\u003cdiv class=\"node violet\">📄 TU.cpp\u003cbr>  Original Translation Unit of work\u003c/div>\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"pieces\">\u003cdiv class=\"node split\">📄 add.cpp\u003c/div>\u003cdiv class=\"node split\">📄 multiply.cpp\u003c/div>\u003cdiv class=\"node split\">📄 greet.cpp\u003c/div>\u003cdiv class=\"node split\">📄 average.cpp\u003c/div>\u003cdiv class=\"node split\">📄 definitions.cpp\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"lead\">Split the atom: one piece per function. Finer-grained compilation. Finer-grained caching. Finer-grained distribution\u003c/p>","eyebrow":"","layout":"","notes":"A translation unit is the atom of a C++ build — the smallest thing the compiler, the cache and the scheduler can take. Touch one function, the whole atom recompiles, misses the cache, goes out as one action. The proposition is to split the atom, one piece per function, while the build system still gets the object it asked for."},{"chapter":"Opening","chapterlabel":"Translation Unit (TU) Fission","content":"\u003ch2>\u003cspan class=\"violet\">Header only\u003c/span> libraries are everywhere.\u003c/h2>\u003cdiv class=\"grid two\">\u003cpre class=\"code\" data-language=\"cpp\">// mylib.h\n#pragma once\n#include &lt;string&gt;\n#include &lt;vector&gt;\n#include &lt;numeric&gt;\n#include &lt;algorithm&gt;\n\ninline int add(int a, int b) {\n    return a + b;\n}\ninline int multiply(int a, int b) {\n    return a * b;\n}\u003c/pre>\u003cpre class=\"code\" data-language=\"cpp\">inline std::string\ngreet(const std::string&amp; name) {\n    return &quot;Hello, &quot; + name + &quot;!&quot;;\n}\ninline double\naverage(const std::vector&lt;double&gt;&amp; v) {\n    if (v.empty()) return 0.0;\n    double sum = std::accumulate(\n        v.begin(), v.end(), 0.0);\n    return sum / v.size();\n}\ntemplate&lt;typename T&gt;\nT max_of(T a, T b) {\n    return (a &gt; b) ? a : b;\n}\u003c/pre>\u003c/div>","eyebrow":"","layout":"","notes":"Before the atom, the thing every atom carries a copy of. Header-only libraries — Boost, Eigen, fmt, the test frameworks, most of what people write themselves — put function bodies in headers. mylib.h is the fixture the rest of the talk splits: inline functions and a template, included by every unit that uses them. Edit one body and every including translation unit recompiles, misses the cache, goes out again. That is the cost the fission goes after."},{"chapter":"Architecture","chapterlabel":"01 / Input","content":"\u003ch2>The build asks for\u003cbr>\u003cspan class=\"split\">use_mylib.o\u003c/span>.\u003c/h2>\u003cpre class=\"code\" data-language=\"cpp\">cpp-splitter clang++ -I. -MD -MF use_mylib.o.d -c -o use_mylib.o use_mylib.cpp\u003c/pre>\u003cdiv class=\"tree\">use_mylib.o.split/\u003cbr>├── \u003cspan class=\"accent\">prefix.h\u003c/span> · libclang PCH\u003cbr>├── \u003cspan class=\"accent\">preamble.h\u003c/span> · compiler PCH\u003cbr>├── definitions header + owner\u003cbr>├── mirrored include/ tree\u003cbr>├── one source + object per piece\u003cbr>└── cache · hash · harvest · depfile\u003c/div>","eyebrow":"","layout":"","notes":"Section 1 — input. The splitter is a CMAKE_CXX_COMPILER_LAUNCHER, invoked in place of the compiler."},{"chapter":"Architecture","chapterlabel":"01 / Contract","content":"\u003ch2>Same compiler command.\u003cbr>Different interior.\u003c/h2>\u003cdiv class=\"flow\">\u003cdiv class=\"node violet \" >build asks use_mylib.o\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node  \" >cpp-splitter\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node split \" >split tree + pieces\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node violet \" >use_mylib.o\u003c/div>\u003c/div>\u003cdiv class=\"paths\" data-paths=\"{&quot;cache match&quot;:&quot;reuse — use the existing split tree; recompile nothing; touch the requested object.&quot;,&quot;one body changed&quot;:&quot;re-slice — splice the recorded changed body, renumber #line, and rewrite the harvest without parsing.&quot;,&quot;other input change&quot;:&quot;parse — when inputs differ beyond a recorded body, parse with libclang locally or use the configured remote emit-only path.&quot;}\">\u003c/div>\u003cdiv class=\"rationale\">Rationale — Preserve the requested object and dependency contract while making function-sized compilation units available to the scheduler.\u003c/div>","eyebrow":"","layout":"","notes":"Rationale, section 1: keep the output at the path requested by the build so downstream tools remain unaware."},{"chapter":"Architecture","chapterlabel":"02 / Parse once","content":"\u003ch2>Harvest extents,\u003cbr>context, \u003cspan class=\"accent\">emission\u003c/span>.\u003c/h2>\u003cdiv class=\"flow\">\u003cdiv class=\"node  \" >include prefix\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node teal \" >libclang PCH\u003cbr>hash + deps\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node  \" >one AST parse\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node split \" >definitions + spans\u003cbr>conditionals + reach\u003c/div>\u003c/div>\u003cdiv class=\"rationale\">Rationale — Cache the expensive include prefix by content and parse once to collect exact source extents and inclusion reachability.\u003c/div>","eyebrow":"","layout":"","notes":"Section 2 — parse. Prefix includes become a content-keyed libclang PCH and parse occurs once."},{"chapter":"Architecture","chapterlabel":"03 / Classification","content":"\u003ch2>Not every body\u003cbr>is movable.\u003c/h2>\u003cdiv class=\"grid two\">\u003cdiv class=\"card \" >\u003ch3 class=\"accent\">split\u003c/h3>\u003cp>Ordinary emitted definitions become pieces.\u003c/p>\u003c/div>\u003cdiv class=\"card \" >\u003ch3 class=\"split\">keep\u003c/h3>\u003cp>main · templates · virtuals · constructors · destructors · internal header linkage · macro-bound extents · not emitted\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"rationale\">Rationale — Keep forms whose semantics depend on instantiation, linkage, class syntax, or unreplayable macro context rather than approximating them.\u003c/div>","eyebrow":"","layout":"","notes":"Section 3 — classification. main is deliberately kept in the definitions owner. Templates and other unsafe forms are kept."},{"chapter":"Architecture","chapterlabel":"04 / Two preambles","content":"\u003ch2>Declarations everywhere.\u003cbr>\u003cspan class=\"violet\">One owner\u003c/span> for unique definitions.\u003c/h2>\u003cdiv class=\"grid two\">\u003cdiv class=\"card file\"  tabindex=\"0\" role=\"button\" data-popup=\"preamble\">\u003ch3 class=\"\">use_mylib_preamble.h\u003c/h3>\u003cp>Includes + declarations. Every piece includes it; its matching compiler PCH is reused.\u003c/p>\u003c/div>\u003cdiv class=\"card file\"  tabindex=\"0\" role=\"button\" data-popup=\"definitions\">\u003ch3 class=\"\">use_mylib.cpp_definitions.h\u003c/h3>\u003cp>Kept external definitions, including main. Included by exactly one owner piece.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"rationale\">Rationale — Share parsed declarations through a compiler PCH while assigning definitions that may exist once to a single, explicit object owner.\u003c/div>","eyebrow":"","layout":"","notes":"Section 4 — two preamble layers. Do not claim -fkeep-inline-functions."},{"chapter":"Architecture","chapterlabel":"05 / Header mirror","content":"\u003ch2>A header is a source\u003cbr>of \u003cspan class=\"accent\">pieces\u003c/span>, too.\u003c/h2>\u003cdiv class=\"flow\">\u003cdiv class=\"node  file\"  tabindex=\"0\" role=\"button\" data-popup=\"header\">mylib.h\u003cbr>original bodies\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node teal file\"  tabindex=\"0\" role=\"button\" data-popup=\"mirror\">include/mylib.h\u003cbr>declarations\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node split \" >_1_add.cpp …\u003cbr>_4_average.cpp\u003c/div>\u003c/div>\u003cp class=\"lead\">The split include root precedes project include directories.\u003c/p>","eyebrow":"","layout":"","notes":"Section 5 — rewrite project headers that the unit reads, mirror by include path, and put that root first."},{"chapter":"Architecture","chapterlabel":"05 / Header piece","content":"\u003ch2>Context first.\u003cbr>Body second.\u003c/h2>\u003cpre class=\"code\" data-language=\"cpp\">// include/mylib.h_1_add.cpp\n#include &quot;use_mylib_preamble.h&quot;\n#include &quot;mylib.h&quot;\n\n__attribute__((used))\n#line 7 &quot;/…/mylib.h&quot;\ninline int add(int a, int b) { return a + b; }\u003c/pre>\u003cdiv class=\"rationale\">Rationale — Mirror included paths and compile each moved body under its consumer’s declaration context so resolution remains equivalent.\u003c/div>","eyebrow":"","layout":"","notes":"Each header piece includes the unit preamble before the rewritten header. It carries #line and used attribute; no claim about -fkeep-inline-functions."},{"chapter":"Architecture","chapterlabel":"06 / Context survives","content":"\u003ch2>Members move \u003cspan class=\"violet\">out\u003c/span>.\u003cbr>Conditionals move \u003cspan class=\"split\">with\u003c/span> them.\u003c/h2>\u003cdiv class=\"grid two\">\u003cpre class=\"code\" data-language=\"cpp\">// class\nint value() const { return value_; }\n\n// rewritten declaration\nint value() const;\u003c/pre>\u003cpre class=\"code\" data-language=\"cpp\">// piece\nnamespace demo {\nauto Widget::value() const\n  -&gt; int { return value_; }\n}\u003c/pre>\u003c/div>\u003cdiv class=\"rationale\">Rationale — Re-emit member syntax where it is valid and replay active preprocessor conditionals to retain both lookup and availability.\u003c/div>","eyebrow":"","layout":"","notes":"Section 6 — members are emitted out-of-class using trailing return types; enclosing conditional context is replayed."},{"chapter":"Architecture","chapterlabel":"07 / Four paths","content":"\u003ch2>Most invocations\u003cbr>should \u003cspan class=\"accent\">not parse\u003c/span>.\u003c/h2>\u003cdiv class=\"logic\">\u003cdiv class=\"node\">split.cache matches\u003cbr>→ reuse\u003c/div>\u003cdiv class=\"decision\">one body only?\u003c/div>\u003cdiv class=\"node split\">harvest splice\u003cbr>→ re-slice\u003c/div>\u003c/div>\u003cdiv class=\"flow\">\u003cdiv class=\"node  \" >otherwise\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node violet \" >remote split if configured\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node  \" >or local libclang parse\u003c/div>\u003c/div>","eyebrow":"","layout":"","notes":"Section 7 — reuse, reslice, parse local, or remote split. A reslice is checked to write same tree as a full split for same edit."},{"chapter":"Architecture","chapterlabel":"07 / Records","content":"\u003ch2>Remember enough\u003cbr>to change \u003cspan class=\"split\">only a body\u003c/span>.\u003c/h2>\u003cdiv class=\"grid three\">\u003cdiv class=\"card \" >\u003ch3 class=\"\">depfile.cache\u003c/h3>\u003cp>Original prerequisites remain visible to the build.\u003c/p>\u003c/div>\u003cdiv class=\"card \" >\u003ch3 class=\"\">inputs.hash\u003c/h3>\u003cp>Content hashes for prerequisites.\u003c/p>\u003c/div>\u003cdiv class=\"card \" >\u003ch3 class=\"\">harvest\u003c/h3>\u003cp>Extents, gaps, body/signature hashes, piece ownership.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"rationale\">Rationale — Record content and source geometry so a body-only change can recreate the same split tree without rebuilding the AST.\u003c/div>","eyebrow":"","layout":"","notes":"The records are depfile.cache, inputs.hash, split.cache, and harvest."},{"chapter":"Architecture","chapterlabel":"08 / Recompose","content":"\u003ch2>Many objects in.\u003cbr>\u003cspan class=\"violet\">One ordinary object\u003c/span> out.\u003c/h2>\u003cdiv class=\"flow\">\u003cdiv class=\"node split \" >add.o\u003c/div>\u003cdiv class=\"node split \" >multiply.o\u003c/div>\u003cdiv class=\"node split \" >greet.o\u003c/div>\u003cdiv class=\"node split \" >average.o\u003c/div>\u003cdiv class=\"node violet \" >definitions.o\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node teal \" >ld -r\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node  \" >use_mylib.o\u003c/div>\u003c/div>\u003cdiv class=\"rationale\">Rationale — Use relocatable linking to return precisely the conventional object file expected by every downstream build step.\u003c/div>","eyebrow":"","layout":"","notes":"Section 8 — ld -r combines object pieces to ordinary object. The linker may be ld, mold, or ld.lld; all use -r."},{"chapter":"Architecture","chapterlabel":"08 ½ / Modules","content":"\u003ch2>Tomorrow \u003cspan class=\"violet\">modules\u003c/span> will be everywhere.\u003c/h2>\u003cdiv class=\"grid two\">\u003cpre class=\"code\" data-language=\"cpp\">// foo.cxx — the interface unit\nmodule;\n#include &lt;iostream&gt;\n\nexport module foo;\n\nexport class foo {\npublic:\n  foo();\n  ~foo();\n  void helloworld();\n};\u003c/pre>\u003cpre class=\"code\" data-language=\"cpp\">// …and its bodies, in the same file\nfoo::foo() = default;\nfoo::~foo() = default;\nvoid foo::helloworld() {\n  std::cout &lt;&lt; &quot;hello world\\n&quot;;\n}\n\n// every body edit changes the BMI:\n// its ODR hash is stored, even with\n// -fmodules-reduced-bmi\u003c/pre>\u003c/div>\u003cdiv class=\"rationale\">No header reparsed by importers — but the BMI they read changes on every body edit, non-inline bodies included. So let's autosplit them before we, or the LLM, adopt them: we or the agent will write everything in the same file, all lazy.\u003c/div>","eyebrow":"","layout":"","notes":"Modules do a great job at not reparsing headers all the time — an importer reads the BMI instead of the header text. But the BMI is what every importer depends on, and even with -fmodules-reduced-bmi, which drops the non-inline bodies from it, clang stores the ODR hash of every definition in the BMI, so any body edit — a non-inline body too — changes the BMI and every importer rebuilds or misses the cache. Measured in TODO/43 with clang 21. Therefore let's autosplit them before we or LLMs adopt them: we, or the agent, will write everything in the same file, all lazy."},{"chapter":"Architecture","chapterlabel":"09 / Remote Execution & Caching","content":"\u003ch2>\u003cspan class=\"accent\">Remote\u003c/span> C++ splitting \u003c/h2>\u003cp class=\"lead\">Leverage CMake RE's rewrapper to distribute and cache splitting.\u003c/p>\u003cdiv class=\"flow\">\u003cdiv class=\"node  \" >CPP_SPLITTER_REMOTE_SPLIT=1 cpp-splitter\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node violet \" >rewrapper cpp-splitter\u003cbr>(local preprocessor input scan)\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node split \" >remote worker\u003cbr>libclang parse\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node teal \" >download split tree\u003c/div>\u003c/div>\u003cdiv class=\"rationale\">Parsing C++ requires alot of RAM depending the codebase, leverage scalable build distribution cluster with Bazel RBE when run with CMake RE, also with remote compilation and scheduling.\u003c/div>","eyebrow":"","layout":"","notes":"Section 9 — emit-only splitter is invoked using CMake RE's rewrapper when remote configuration exists; tree returns through output directories and compiles/link follow."},{"chapter":"Binary evidence","chapterlabel":"Binary / the controlled comparison","content":"\u003ch2>Same \u003cspan class=\"accent\">code\u003c/span>.\u003cbr>Different metadata.\u003c/h2>\u003cp class=\"lead\">plain-gc versus split-lto-relink-gc\u003c/p>\u003cdiv class=\"flag\">\u003cspan class=\"violet\">plain-gc\u003c/span>  -O2 -ffunction-sections -fdata-sections -Wl,--gc-sections\u003cbr>\u003cspan class=\"split\">split-lto-relink-gc\u003c/span>  same flags + -flto=thin · CPP_SPLITTER_LINKER=ld.lld\u003c/div>\u003cdiv class=\"flow\">\u003cdiv class=\"node violet \" >one plain TU\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node split \" >pieces → ld.lld -r\u003cbr>per-TU ThinLTO\u003c/div>\u003cdiv class=\"arrow\">→\u003c/div>\u003cdiv class=\"node teal \" >final section GC\u003c/div>\u003c/div>\u003cdiv class=\"tiny\">The baseline does \u003cspan class=\"accent\">not\u003c/span> use LTO. lld relinks the split unit to a native object; final linking does no LTO across units.\u003c/div>","eyebrow":"","layout":"","notes":"Measurements only from example/binary-impact/README.md: 14 Sep 2026, clang 13.0.0, -O2, lld final linker. We compare the plain-gc baseline with the combined split-lto-relink-gc case—not an eight-way tour."},{"chapter":"Binary evidence","chapterlabel":"Binary / semantic symbol diff","content":"\u003ch2>Five source names\u003cbr>versus \u003cspan class=\"violet\">one\u003c/span>.\u003c/h2>\u003cdiv class=\"semantic\">\u003cdiv>\u003ch3 class=\"violet\">plain-gc\u003c/h3>\u003cpre class=\"code\">use_mylib.cpp\n\u003cspan class=\"same\"> main\u003c/span>\n\u003cspan class=\"same\"> greet [W]\u003c/span>\n\u003cspan class=\"same\"> add / multiply / average\u003c/span>\n\u003cspan class=\"same\"> folded into main\u003c/span>\n\u003cspan class=\"same\"> max_of&lt;T&gt; stays in header\u003c/span>\u003c/pre>\u003c/div>\u003cdiv class=\"arrow\">⇄\u003c/div>\u003cdiv>\u003ch3 class=\"accent\">split-lto-relink-gc\u003c/h3>\u003cpre class=\"code\">\u003cspan class=\"diffline\">use_mylib.cpp_0_definitions.cpp\u003c/span>\n\u003cspan class=\"same\"> main\u003c/span>\n\u003cspan class=\"same\"> greet [W]\u003c/span>\n\u003cspan class=\"diffline\"> mylib.h_1_add.cpp … _4_average.cpp\u003c/span>\n\u003cspan class=\"same\"> add / multiply / average:\u003c/span>\n\u003cspan class=\"same\"> inlined, weak copies GC’d\u003c/span>\n\u003cspan class=\"same\"> max_of&lt;T&gt;: no moved piece\u003c/span>\u003c/pre>\u003c/div>\u003c/div>\u003cdiv class=\"tiny\">SCHEMATIC: names and status from the report, not an exact raw symbol listing. \u003cspan class=\"violet\">Symbol-table string metadata: +184 B.\u003c/span>\u003c/div>","eyebrow":"","layout":"","notes":"A coloured semantic diagram of measured source-file symbol naming—not raw nm output. The relink restores inlining. main is owned by the definitions piece; greet is weak in both; the template is not moved."},{"chapter":"Binary evidence","chapterlabel":"Binary / section equality map","content":"\u003ch2>\u003cspan class=\"accent\">18 equal.\u003c/span>\u003cbr>10 metadata differences.\u003c/h2>\u003cp class=\"lead\">A schematic diff of measured section status — not a raw byte dump.\u003c/p>\u003cdiv class=\"section-map\" data-section-map=\"[\n {&quot;name&quot;:&quot;.text&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;.text is byte-identical at the same address in this measured pair.&quot;},\n {&quot;name&quot;:&quot;.plt&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;.plt is byte-identical at the same address.&quot;},\n {&quot;name&quot;:&quot;.rodata&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;.rodata is byte-identical at the same address.&quot;},\n {&quot;name&quot;:&quot;.eh_frame&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;Unwind metadata is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.eh_frame_hdr&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The unwind header is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.gcc_except_table&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The exception table is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.init&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The initialization section is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.fini&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The finalization section is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.init_array&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The initialization array is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.fini_array&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The finalization array is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.got&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The global offset table is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.got.plt&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;.got.plt is byte-identical at the same address.&quot;},\n {&quot;name&quot;:&quot;.dynamic&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;Dynamic table bytes are equal.&quot;},\n {&quot;name&quot;:&quot;.interp&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The interpreter section is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.note.ABI-tag&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The ABI note is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.tm_clone_table&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The clone table is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.comment&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The comment section is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.shstrtab&quot;,&quot;equal&quot;:true,&quot;detail&quot;:&quot;The section-name table is byte-identical.&quot;},\n {&quot;name&quot;:&quot;.symtab&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;Five split source-file names and local symbol numbering add 184 B.&quot;},\n {&quot;name&quot;:&quot;.strtab&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;String-table metadata differs with source-file names.&quot;},\n {&quot;name&quot;:&quot;.dynsym&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;Dynamic symbol ordering follows the relinked metadata.&quot;},\n {&quot;name&quot;:&quot;.dynstr&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;Dynamic string ordering follows the relinked metadata.&quot;},\n {&quot;name&quot;:&quot;.hash&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;Hash metadata changes with dynamic-symbol ordering.&quot;},\n {&quot;name&quot;:&quot;.gnu.hash&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;GNU hash metadata changes with dynamic-symbol ordering.&quot;},\n {&quot;name&quot;:&quot;.gnu.version&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;Version metadata follows dynamic-symbol ordering.&quot;},\n {&quot;name&quot;:&quot;.gnu.version_r&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;Version requirement metadata follows symbol ordering.&quot;},\n {&quot;name&quot;:&quot;.rela.dyn&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;Relocation metadata differs in ordering; imports are the same.&quot;},\n {&quot;name&quot;:&quot;.rela.plt&quot;,&quot;equal&quot;:false,&quot;detail&quot;:&quot;PLT relocations have the same slots but a different order.&quot;}\n]\">\u003c/div>\u003cdiv class=\"tiny\">Equal at the same addresses: \u003cspan class=\"accent\">.text\u003c/span>, \u003cspan class=\"accent\">.plt\u003c/span>, \u003cspan class=\"accent\">.rodata\u003c/span>, \u003cspan class=\"accent\">.got.plt\u003c/span>, and unwind sections. Differing dynamic metadata includes .dynsym and .rela.*; same 19 imports and PLT slots, different order.\u003c/div>","eyebrow":"","layout":"section-map","notes":"Click a section. 18 sections are byte-identical and 10 differ. Dynamic metadata can be loaded, so do not say every loaded section is identical."},{"chapter":"Binary evidence","chapterlabel":"Binary / paired sizes","content":"\u003ch2>Code stays level.\u003cbr>File grows \u003cspan class=\"violet\">184 B\u003c/span>.\u003c/h2>\u003cdiv class=\"sizes\" data-sizes=\"{\n  &quot;scale&quot;: 8880,\n  &quot;unit&quot;: &quot;B&quot;,\n  &quot;plainLabel&quot;: &quot;plain-gc&quot;,\n  &quot;splitLabel&quot;: &quot;split-LTO+GC&quot;,\n  &quot;allLabel&quot;: &quot;all metrics&quot;,\n  &quot;controls&quot;: [&quot;executable&quot;, &quot;text&quot;, &quot;stripped&quot;],\n  &quot;metrics&quot;: [\n    {&quot;name&quot;: &quot;executable&quot;, &quot;label&quot;: &quot;executable&quot;, &quot;plain&quot;: 8696, &quot;split&quot;: 8880, &quot;note&quot;: &quot;+184 B · 2.12%&quot;},\n    {&quot;name&quot;: &quot;text&quot;, &quot;label&quot;: &quot;.text&quot;, &quot;plain&quot;: 3314, &quot;split&quot;: 3314, &quot;note&quot;: &quot;equal&quot;},\n    {&quot;name&quot;: &quot;data&quot;, &quot;label&quot;: &quot;.data&quot;, &quot;plain&quot;: 584, &quot;split&quot;: 584, &quot;note&quot;: &quot;equal&quot;},\n    {&quot;name&quot;: &quot;stripped&quot;, &quot;label&quot;: &quot;stripped&quot;, &quot;plain&quot;: 6752, &quot;split&quot;: 6752, &quot;note&quot;: &quot;equal size · 385 B differ&quot;}\n  ]\n}\">\u003c/div>\u003cdiv class=\"tiny\">Baseline is always \u003cspan class=\"violet\">plain-gc\u003c/span>. 22 symbols vs 22; normalized instructions 178 vs 178. Stripped: 6,752 B vs 6,752 B, yet 385 bytes differ in dynamic-symbol ordering.\u003c/div>","eyebrow":"","layout":"","notes":"Bars share an explicit zero baseline and the canonical shared 0–8,880-byte scale. File delta is 184 bytes, approximately 2.12 percent. Stripping symbol tables yields same size but 385 bytes still differ due to dynamic-symbol ordering."},{"chapter":"Binary evidence","chapterlabel":"Binary / why the result converges","content":"\u003ch2>Inline. Relink.\u003cbr>\u003cspan class=\"split\">Collect.\u003c/span>\u003c/h2>\u003cdiv class=\"binary-trace\" data-binary-trace=\"{\n  &quot;main&quot;: {\n    &quot;label&quot;: &quot;main&quot;,\n    &quot;source&quot;: &quot;int main() { add(...); multiply(...); average(vals); greet(...); }&quot;,\n    &quot;plainLabel&quot;: &quot;PLAIN-GC&quot;,\n    &quot;splitLabel&quot;: &quot;SPLIT-LTO-RELINK-GC&quot;,\n    &quot;plain&quot;: &quot;plain-gc: one TU sees bodies → add/multiply/average fold into main.&quot;,\n    &quot;split&quot;: &quot;split: definitions owner holds main; ld.lld -r ThinLTO sees all pieces → same folded main.&quot;,\n    &quot;note&quot;: &quot;Measured outcome: 178 normalized instructions and 3,314 B .text in each executable.&quot;\n  },\n  &quot;greet&quot;: {\n    &quot;label&quot;: &quot;greet&quot;,\n    &quot;source&quot;: &quot;inline std::string greet(...) { … }&quot;,\n    &quot;plainLabel&quot;: &quot;PLAIN-GC&quot;,\n    &quot;splitLabel&quot;: &quot;SPLIT-LTO-RELINK-GC&quot;,\n    &quot;plain&quot;: &quot;plain-gc: weak out-of-line greet remains.&quot;,\n    &quot;split&quot;: &quot;split: greet is weak in both; no separate semantic difference.&quot;,\n    &quot;note&quot;: &quot;Semantic trace of the measured mechanism; not raw assembly or an exact symbol dump.&quot;\n  },\n  &quot;add&quot;: {\n    &quot;label&quot;: &quot;add&quot;,\n    &quot;source&quot;: &quot;inline int add(int a,int b) { return a+b; }&quot;,\n    &quot;plainLabel&quot;: &quot;PLAIN-GC&quot;,\n    &quot;splitLabel&quot;: &quot;SPLIT-LTO-RELINK-GC&quot;,\n    &quot;plain&quot;: &quot;plain-gc: folded into main; no standalone final copy.&quot;,\n    &quot;split&quot;: &quot;split: piece emits a used weak copy; relink inlines it, then final --gc-sections removes the uncalled section.&quot;,\n    &quot;note&quot;: &quot;Semantic trace of the measured mechanism; not raw assembly or an exact symbol dump.&quot;\n  },\n  &quot;multiply&quot;: {\n    &quot;label&quot;: &quot;multiply&quot;,\n    &quot;source&quot;: &quot;inline int multiply(int a,int b) { return a*b; }&quot;,\n    &quot;plainLabel&quot;: &quot;PLAIN-GC&quot;,\n    &quot;splitLabel&quot;: &quot;SPLIT-LTO-RELINK-GC&quot;,\n    &quot;plain&quot;: &quot;plain-gc: folded into main; no standalone final copy.&quot;,\n    &quot;split&quot;: &quot;split: relink restores folding; final section GC removes uncalled weak copy.&quot;,\n    &quot;note&quot;: &quot;Semantic trace of the measured mechanism; not raw assembly or an exact symbol dump.&quot;\n  },\n  &quot;average&quot;: {\n    &quot;label&quot;: &quot;average&quot;,\n    &quot;source&quot;: &quot;inline double average(vector&lt;double&gt; const&amp;) { … }&quot;,\n    &quot;plainLabel&quot;: &quot;PLAIN-GC&quot;,\n    &quot;splitLabel&quot;: &quot;SPLIT-LTO-RELINK-GC&quot;,\n    &quot;plain&quot;: &quot;plain-gc: folded into main; vector construction folds away.&quot;,\n    &quot;split&quot;: &quot;split: per-TU relink LTO restores the same fold; final GC removes uncalled weak copy.&quot;,\n    &quot;note&quot;: &quot;Semantic trace of the measured mechanism; not raw assembly or an exact symbol dump.&quot;\n  },\n  &quot;max_of&quot;: {\n    &quot;label&quot;: &quot;max_of&lt;T&gt;&quot;,\n    &quot;source&quot;: &quot;template&lt;class T&gt; T max_of(T a,T b) { … }&quot;,\n    &quot;plainLabel&quot;: &quot;PLAIN-GC&quot;,\n    &quot;splitLabel&quot;: &quot;SPLIT-LTO-RELINK-GC&quot;,\n    &quot;plain&quot;: &quot;plain-gc: template stays in the header.&quot;,\n    &quot;split&quot;: &quot;split: template stays in the header — no moved piece.&quot;,\n    &quot;note&quot;: &quot;Semantic trace of the measured mechanism; not raw assembly or an exact symbol dump.&quot;\n  }\n}\">\u003c/div>\u003cdiv class=\"tiny\">Summary: \u003cspan class=\"accent\">Identical executable code. Different symbol metadata.\u003c/span> Not byte-identical executables.\u003c/div>","eyebrow":"","layout":"","notes":"A semantic trace, not assembly or raw nm. LTO at ld.lld -r sees all pieces of the unit, restores inlining, then final --gc-sections drops uncalled weak copies."},{"chapter":"Benchmarks","chapterlabel":"","content":"\u003cp class=\"lead\">\"Nuclear fission is the process in which the nucleus of a heavy atom splits into two or more smaller nuclei, releasing a massive amount of energy.\"\u003c/p>\u003cdiv class=\"tiny\">— Wikipedia, Nuclear fission\u003c/div>","eyebrow":"","layout":"quote","notes":"Wikipedia's definition of nuclear fission, before the numbers: split the nucleus, release the energy. What follows measures how much."},{"chapter":"Benchmarks","chapterlabel":"Benchmark set 1 / cluster −j500","content":"\u003ch2>End-to-end wall time.\u003cbr>Five scenarios.\u003c/h2>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"\">\u003c/i>plain\u003c/span>\u003cspan>\u003ci class=\"s\">\u003c/i>splitter\u003c/span>\u003c/div>\u003cdiv class=\"tiny\">277 Boost.Spirit programs · 279 translation units · AMD EPYC-Milan (32 cores, 122 GiB) · clang 13.0.0 · C++17 Release · EngFlow RBE over mTLS\u003c/div>\u003cdiv class=\"bars\" data-bars=\"[{&quot;label&quot;:&quot;full&quot;,&quot;plain&quot;:32.1,&quot;split&quot;:456.0},{&quot;label&quot;:&quot;no-op&quot;,&quot;plain&quot;:12.0,&quot;split&quot;:17.7},{&quot;label&quot;:&quot;source touch&quot;,&quot;plain&quot;:11.9,&quot;split&quot;:13.9},{&quot;label&quot;:&quot;header touch&quot;,&quot;plain&quot;:12.0,&quot;split&quot;:13.8},{&quot;label&quot;:&quot;one body&quot;,&quot;plain&quot;:136.2,&quot;split&quot;:74.9}]\">\u003c/div>\u003cdiv class=\"tiny\">Each bar is value ÷ this set’s 456.0s maximum, from a zero baseline. Full: cached actions only (1,641 plain / 15,885 split), not cold compilation.\u003c/div>","eyebrow":"","layout":"","notes":"Set 1: -j500 end-to-end wall, one single run. Full is a cached-action overhead row, not cold compilation. Values are only comparable inside this set."},{"chapter":"Benchmarks","chapterlabel":"Set 1 / what changed","content":"\u003ch2>\u003cspan class=\"split\">194\u003c/span> units reach it.\u003cbr>\u003cspan class=\"accent\">One\u003c/span> emits it.\u003c/h2>\u003cdiv class=\"grid three\">\u003cdiv class=\"card\">\u003cdiv class=\"metric \">271\u003c/div>\u003cdiv class=\"label\">plain remote compiles\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"metric accent\">1\u003c/div>\u003cdiv class=\"label\">split remote compile\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"metric violet\">1575\u003c/div>\u003cdiv class=\"label\">split cached actions\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"lead\">The body-edit comparison is 136.2s versus 74.9s, within this single end-to-end set.\u003c/p>","eyebrow":"","layout":"","notes":"Set 1 actions: body edit executes 271 plain remote compiles vs 1 split remote compile, with 1575 cache hits. 194 units reach header and exactly one emits."},{"chapter":"Benchmarks","chapterlabel":"Benchmark set 2 / remote split −j500","content":"\u003ch2>Build-only. One configuration.\u003cbr>Not a speedup denominator.\u003c/h2>\u003cdiv class=\"bars\">\u003cdiv class=\"barrow singlebar\">\u003cb>full\u003c/b>\u003cdiv class=\"barwrap\">\u003cdiv class=\"bar s\" style=\"width:100.000%\">\u003c/div>\u003c/div>\u003cdiv class=\"barwrap singlebar-detail\">\u003cspan class=\"barlabel\">357.5s · 279 cluster splits\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"barrow singlebar\">\u003cb>no-op\u003c/b>\u003cdiv class=\"barwrap\">\u003cdiv class=\"bar s\" style=\"width:3.497%\">\u003c/div>\u003c/div>\u003cdiv class=\"barwrap singlebar-detail\">\u003cspan class=\"barlabel\">12.5s · all 279 reused\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"barrow singlebar\">\u003cb>source touch\u003c/b>\u003cdiv class=\"barwrap\">\u003cdiv class=\"bar s\" style=\"width:1.706%\">\u003c/div>\u003c/div>\u003cdiv class=\"barwrap singlebar-detail\">\u003cspan class=\"barlabel\">6.1s · not re-mirrored\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"barrow singlebar\">\u003cb>header touch\u003c/b>\u003cdiv class=\"barwrap\">\u003cdiv class=\"bar s\" style=\"width:1.706%\">\u003c/div>\u003c/div>\u003cdiv class=\"barwrap singlebar-detail\">\u003cspan class=\"barlabel\">6.1s · not re-mirrored\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"barrow singlebar\">\u003cb>one body\u003c/b>\u003cdiv class=\"barwrap\">\u003cdiv class=\"bar s\" style=\"width:9.231%\">\u003c/div>\u003c/div>\u003cdiv class=\"barwrap singlebar-detail\">\u003cspan class=\"barlabel\">33.0s · 268 re-slices, 1 remote\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"callout\">33.0s is not compared to the first set’s 136.2s: setup and timing scope differ. Full: 279 cluster splits; no-op: all 279 reused; body edit: 268 re-slices, 1 remote.\u003c/div>","eyebrow":"","layout":"","notes":"Set 2 is distinct: remote split, single configuration, build-only. 279 units. Never compare 33.0 seconds to set 1 136.2 seconds."},{"chapter":"Benchmarks","chapterlabel":"Benchmark set 3 / host −j16","content":"\u003ch2>On one machine,\u003cbr>pieces are \u003cspan class=\"split\">more work\u003c/span>.\u003c/h2>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"\">\u003c/i>plain\u003c/span>\u003cspan>\u003ci class=\"s\">\u003c/i>splitter\u003c/span>\u003c/div>\u003cdiv class=\"bars\" data-bars=\"[{&quot;label&quot;:&quot;full&quot;,&quot;plain&quot;:57.8,&quot;split&quot;:654.6},{&quot;label&quot;:&quot;no-op&quot;,&quot;plain&quot;:5.7,&quot;split&quot;:11.4},{&quot;label&quot;:&quot;source touch&quot;,&quot;plain&quot;:5.6,&quot;split&quot;:6.0},{&quot;label&quot;:&quot;header touch&quot;,&quot;plain&quot;:5.7,&quot;split&quot;:6.0},{&quot;label&quot;:&quot;one body&quot;,&quot;plain&quot;:57.5,&quot;split&quot;:14.2}]\">\u003c/div>\u003cdiv class=\"tiny\">Each bar is value ÷ this set’s 654.6s maximum, from a zero baseline. Build-only timing; no cluster per-action records.\u003c/div>","eyebrow":"","layout":"","notes":"Set 3 is host -j16, build-only. Full cold host costs 57.8 vs 654.6; body edit 57.5 vs 14.2."},{"chapter":"Conclusions","chapterlabel":"Costs are real","content":"\u003ch2>The layout trades\u003cbr>\u003cspan class=\"split\">coarse work\u003c/span> for \u003cspan class=\"violet\">many artifacts\u003c/span>.\u003c/h2>\u003cdiv class=\"grid three\">\u003cdiv class=\"card\">\u003cdiv class=\"metric \">9.7×\u003c/div>\u003cdiv class=\"label\">cluster full cache lookups 15,885 vs 1,641\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"metric \">589,911\u003c/div>\u003cdiv class=\"label\">blob downloads in an earlier remote-full profile\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"metric \">GB\u003c/div>\u003cdiv class=\"label\">tens of GB split tree vs tens of MB ordinary\u003c/div>\u003c/div>\u003c/div>","eyebrow":"","layout":"","notes":"Costs: more action/cache traffic; remote full transfer count; disk tens of GB vs tens MB. These are one-off runs and one edit is selected."},{"chapter":"Conclusions","chapterlabel":"Read narrowly","content":"\u003ch2>Evidence of a layout\u003cbr>trade, not a \u003cspan class=\"red\">universal win\u003c/span>.\u003c/h2>\u003cdiv class=\"grid two\">\u003cdiv class=\"card \" >\u003ch3 class=\"\">What is supported\u003c/h3>\u003cp>For this selected body edit, action counts change from 271 remote compiles to one; emitted-piece work tracks the changed body.\u003c/p>\u003c/div>\u003cdiv class=\"card \" >\u003ch3 class=\"\">What is not claimed\u003c/h3>\u003cp>No runtime equivalence performance result. No general edit distribution. No cross-set wall-time speedup. Single-run timing is noisy.\u003c/p>\u003c/div>\u003c/div>","eyebrow":"","layout":"","notes":"Limitations: single runs, noise; chosen function reach-to-use 194:1; no general distribution; host has no per-action records; no runtime performance claim."},{"chapter":"Conclusions","chapterlabel":"","content":"\u003ch2>Make the frontend\u003cbr>parallel \u003cspan class=\"accent\">without asking\u003c/span>\u003cbr>the build to change.\u003c/h2>\u003cp class=\"lead\">A source-layout transformation: preserve the requested object; expose per-function work; measure the costs honestly.\u003c/p>\u003cdiv class=\"tiny\">Arrow keys / space · Home / End · N notes · P print\u003c/div>","eyebrow":"Closing","layout":"","notes":"Closing: functional equivalence is a transformation requirement, supported by same output contract and the re-slice/full-split tree equality test; runtime performance is not benchmarked."}],"snippets":{"definitions":["use_mylib.cpp_definitions.h","#pragma once\n#include \"use_mylib_preamble.h\"\n\nint main() { /* body verbatim */ }\n\n// use_mylib.cpp_0_definitions.cpp\n#include \"use_mylib.cpp_definitions.h\"","Kept external definitions, including main, have one owner."],"header":["mylib.h (original)","#pragma once\ninline int add(int a, int b) { return a + b; }\ninline int multiply(int a, int b) { return a * b; }\ninline std::string greet(const std::string& name) { return \"Hello, \" + name + \"!\"; }\ninline double average(const std::vector\u003cdouble>& values) { /* implementation in fixture */ }\ntemplate\u003ctypename T> T max_of(T a, T b) { return (a > b) ? a : b; }","Original inline bodies in the project header."],"mirror":["include/mylib.h (rewritten mirror)","#pragma once\nint add(int a, int b);\nint multiply(int a, int b);\nstd::string greet(const std::string& name);\ndouble average(const std::vector\u003cdouble>& values);\ntemplate\u003ctypename T> T max_of(T a, T b) { return (a > b) ? a : b; }","Declarations replace moved bodies under the same include path."],"preamble":["use_mylib_preamble.h","#pragma once\n#include \"mylib.h\"\n#include \u003ciostream>\n\nint main();","Includes and declarations reused by every piece."]}}</script>
  <script>/* Shared behavior only. Slide content and interactive data come from Markdown. */
(() => {
  "use strict";
  const data = JSON.parse(document.querySelector("#deck-data").textContent);
  const root = document.querySelector("#deck");
  const make = (tag, cls, text) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  };
  const attrData = (el, name) => JSON.parse(el.getAttribute(`data-${name}`));
  const setSelected = (buttons, selected) => {
    for (const b of buttons) {
      b.classList.toggle("active", b === selected);
      b.setAttribute("aria-pressed", String(b === selected));
    }
  };

  for (const slide of data.slides) {
    const el = make("section", "slide");
    el.dataset.chapter = slide.chapter;
    el.dataset.notes = slide.notes;
    if (slide.layout) el.dataset.layout = slide.layout;
    if (slide.eyebrow) el.append(make("div", "eyebrow", slide.eyebrow));
    if (slide.chapterlabel) el.append(make("div", "chapter", slide.chapterlabel));
    // This fragment is escaped and rendered by the trusted Markdown builder.
    const body = document.createElement("template");
    body.innerHTML = slide.content;
    el.append(body.content, make("span", "num"));
    root.append(el);
  }
  const slides = [...root.querySelectorAll(".slide")];
  const progress = document.querySelector("#progress");
  const notes = document.querySelector("#notes");
  const notesToggle = document.querySelector("#notesToggle");
  const chapters = document.querySelector("#chapters");
  const modal = document.querySelector("#modal");
  const closeButton = document.querySelector("#close");
  const modalTitle = document.querySelector("#modalTitle");
  const modalCode = document.querySelector("#modalCode");
  let current = 0;
  let opener = null;

  slides.forEach((slide, i) => {
    slide.querySelector(".num").textContent = `${String(i + 1).padStart(2, "0")} / ${slides.length}`;
  });
  for (const chapter of new Set(slides.map(s => s.dataset.chapter))) {
    const b = make("button", "", chapter);
    b.dataset.chapter = chapter;
    b.onclick = () => show(slides.findIndex(s => s.dataset.chapter === chapter));
    chapters.append(b);
  }
  function show(n, updateHash = true) {
    current = Math.min(slides.length - 1, Math.max(0, Number.isFinite(n) ? n : 0));
    slides.forEach((slide, i) => slide.classList.toggle("active", i === current));
    progress.style.width = `${(current + 1) / slides.length * 100}%`;
    notes.textContent = slides[current].dataset.notes;
    for (const b of chapters.children) b.classList.toggle("on", b.dataset.chapter === slides[current].dataset.chapter);
    if (updateHash) {
      try { history.replaceState(null, "", `#${current + 1}`); }
      catch { location.hash = String(current + 1); }
    }
    window.scrollTo(0, 0);
  }
  notesToggle.onclick = () => {
    notes.classList.toggle("show");
    notesToggle.setAttribute("aria-expanded", String(notes.classList.contains("show")));
  };
  function closeModal() {
    modal.classList.remove("show");
    opener?.focus();
  }
  closeButton.onclick = closeModal;
  modal.onclick = e => { if (e.target === modal) closeModal(); };
  for (const button of root.querySelectorAll("[data-popup]")) {
    button.onclick = () => {
      const source = data.snippets[button.dataset.popup];
      opener = button;
      modalTitle.textContent = source[0];
      modalCode.textContent = source[1];
      highlight(modalCode);
      modal.classList.add("show");
      closeButton.focus();
    };
    button.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        e.stopPropagation();
        button.click();
      }
    };
  }

  for (const box of root.querySelectorAll("[data-bars]")) {
    const rows = attrData(box, "bars");
    const max = Math.max(...rows.flatMap(row => [row.plain, row.split]));
    for (const item of rows) {
      const row = make("div", "barrow");
      row.append(make("b", "", item.label));
      for (const [value, cls] of [[item.plain, "bar"], [item.split, "bar s"]]) {
        const track = make("div", "barwrap");
        const bar = make("div", cls);
        bar.style.width = `${max ? value / max * 100 : 0}%`;
        if (!value) bar.style.minWidth = "0";
        track.append(bar);
        row.append(track);
      }
      row.append(make("span", "barlabel", item.caption ?? `${item.plain.toFixed(1)}s / ${item.split.toFixed(1)}s`));
      box.append(row);
    }
  }
  for (const box of root.querySelectorAll("[data-paths]")) {
    const paths = attrData(box, "paths");
    const controls = make("div", "path-controls");
    const explanation = make("div", "pathview");
    for (const [label, text] of Object.entries(paths)) {
      const b = make("button", "pathbtn", label);
      b.onclick = () => {
        setSelected(controls.children, b);
        explanation.textContent = text;
      };
      controls.append(b);
    }
    box.append(controls, explanation);
    controls.firstElementChild.click();
  }
  for (const box of root.querySelectorAll("[data-section-map]")) {
    const sections = attrData(box, "section-map");
    const grid = make("div", "evidence-grid");
    const detail = make("div", "evidence-detail");
    detail.setAttribute("aria-live", "polite");
    box.closest(".slide").dataset.layout = "section-map";
    for (const section of sections) {
      const b = make("button", `section-chip ${section.equal ? "equal" : "diff"}`);
      b.append(make("strong", "", section.name), make("span", "status", section.status ?? (section.equal ? "✓ equal" : "△ differs")));
      b.onclick = () => {
        setSelected(grid.children, b);
        detail.textContent = section.detail;
      };
      grid.append(b);
    }
    grid.onkeydown = e => {
      if (!["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown"].includes(e.key)) return;
      const buttons = [...grid.children];
      const pos = buttons.indexOf(document.activeElement);
      if (pos < 0) return;
      e.preventDefault();
      const delta = ["ArrowLeft", "ArrowUp"].includes(e.key) ? -1 : 1;
      buttons[(pos + delta + buttons.length) % buttons.length].focus();
    };
    box.append(grid, detail);
    grid.firstElementChild.click();
  }
  for (const box of root.querySelectorAll("[data-sizes]")) {
    const config = attrData(box, "sizes");
    const controls = make("div", "path-controls");
    const board = make("div", "size-board");
    const unit = config.unit ?? "B";
    const plainLabel = config.plainLabel ?? "plain";
    const splitLabel = config.splitLabel ?? "split";
    function draw(key) {
      const legend = make("div", "legend");
      for (const [name, cls] of [[plainLabel, ""], [splitLabel, "s"]]) {
        const label = make("span");
        label.append(make("i", cls), document.createTextNode(name));
        legend.append(label);
      }
      legend.append(make("span", "", `0–${config.scale.toLocaleString("en-US")} ${unit} shared scale`));
      board.replaceChildren(legend);
      for (const metric of config.metrics.filter(m => key === null || m.name === key)) {
        const row = make("div", "size-row");
        row.append(make("b", "", metric.label ?? metric.name));
        for (const [value, cls, label] of [[metric.plain, "size-fill", plainLabel], [metric.split, "size-fill splitfill", splitLabel]]) {
          const track = make("div", "size-track");
          track.setAttribute("aria-label", `${label}: ${value} ${unit}, scale 0 to ${config.scale}`);
          const fill = make("div", cls);
          fill.style.width = `${value / config.scale * 100}%`;
          track.append(fill);
          row.append(track);
        }
        const values = make("span", "size-value", `plain ${metric.plain} · split ${metric.split} ${unit}`);
        values.append(make("br"), document.createTextNode(metric.note));
        row.append(values);
        board.append(row);
      }
    }
    const choices = [null, ...(config.controls ?? config.metrics.map(m => m.name))];
    for (const key of choices) {
      const metric = config.metrics.find(m => m.name === key);
      const b = make("button", "pathbtn", key === null ? (config.allLabel ?? "all metrics") : (metric.label ?? key));
      b.onclick = () => { setSelected(controls.children, b); draw(key); };
      controls.append(b);
    }
    box.append(controls, board);
    controls.firstElementChild.click();
  }
  for (const box of root.querySelectorAll("[data-binary-trace]")) {
    const traces = attrData(box, "binary-trace");
    const controls = make("div", "path-controls");
    const grid = make("div", "trace-layout");
    const source = make("pre", "code");
    const result = make("pre", "code trace-result");
    const detail = make("div", "evidence-detail");
    source.dataset.language = "cpp";
    detail.setAttribute("aria-live", "polite");
    grid.append(source, result);
    for (const [key, trace] of Object.entries(traces)) {
      const b = make("button", "pathbtn", trace.label ?? key);
      b.onclick = () => {
        setSelected(controls.children, b);
        source.textContent = trace.source;
        highlight(source);
        result.textContent = `${trace.plainLabel ?? "PLAIN"}\n${trace.plain}\n\n${trace.splitLabel ?? "SPLIT"}\n${trace.split}`;
        detail.textContent = trace.note;
      };
      controls.append(b);
    }
    box.append(controls, grid, detail);
    controls.firstElementChild.click();
  }

  // The same offline C++ highlighting used before the Markdown migration.
  function highlight(block) {
    const source = block.textContent;
    if (block.dataset.highlightedSource === source) return;
    block.dataset.highlightedSource = source;
    const keywords = new Set("alignas alignof auto break case catch class constexpr consteval constinit const continue decltype default delete do else enum explicit extern false for friend if inline mutable namespace new noexcept nullptr operator override private protected public register reinterpret_cast return sizeof static static_assert static_cast struct switch template this thread_local throw true try typedef typename union using virtual volatile while __attribute__".split(" "));
    const types = new Set("void bool char short int long float double signed unsigned wchar_t size_t string vector numeric iterator T std".split(" "));
    const pattern = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(^[ \t]*#[ \t]*[a-zA-Z_]\w*)|\b(0[xX][\da-fA-F]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[uUlLfF]*)\b|\b([A-Za-z_]\w*)\b|(::|->|&&|\|\||==|!=|<=|>=|[{}()[\];,+*/%=<>!&|~?:.-])/gm;
    const out = document.createDocumentFragment();
    let end = 0;
    for (const m of source.matchAll(pattern)) {
      out.append(document.createTextNode(source.slice(end, m.index)));
      const [text, comment, string, directive, number, word, operator] = m;
      const kind = comment ? "comment" : string ? "string" : directive ? "directive" : number ? "number" : operator ? "operator" : keywords.has(word) ? "keyword" : types.has(word) ? "type" : word && /^\s*(?:<[^;\n{}]*>)?\s*\(/.test(source.slice(m.index + text.length)) ? "function" : "";
      out.append(kind ? make("span", `tok-${kind}`, text) : document.createTextNode(text));
      end = m.index + text.length;
    }
    out.append(document.createTextNode(source.slice(end)));
    block.replaceChildren(out);
    block.classList.add("syntax");
  }
  root.querySelectorAll('[data-chapter="Architecture"] pre.code, pre[data-language="cpp"]').forEach(highlight);

  document.addEventListener("keydown", e => {
    if (modal.classList.contains("show")) {
      if (e.key === "Escape") { e.preventDefault(); closeModal(); }
      if (e.key === "Tab") { e.preventDefault(); closeButton.focus(); }
      return;
    }
    if (e.target.closest('button,input,textarea,[role="button"],[contenteditable="true"]')) return;
    if (["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key)) { e.preventDefault(); show(current + 1); }
    if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); show(current - 1); }
    if (e.key === "Home") { e.preventDefault(); show(0); }
    if (e.key === "End") { e.preventDefault(); show(slides.length - 1); }
    if (e.key.toLowerCase() === "n") notesToggle.click();
    if (e.key.toLowerCase() === "p") window.print();
  });
  let touchStart = null;
  document.addEventListener("touchstart", e => {
    touchStart = e.target.closest("pre,button,[role=button],.modal") ? null : e.changedTouches[0].screenX;
  }, {passive: true});
  document.addEventListener("touchend", e => {
    if (touchStart === null || modal.classList.contains("show")) return;
    const delta = e.changedTouches[0].screenX - touchStart;
    if (Math.abs(delta) > 50) show(current + (delta < 0 ? 1 : -1));
    touchStart = null;
  }, {passive: true});
  window.addEventListener("hashchange", () => show(Number(location.hash.slice(1)) - 1, false));
  show(Number(location.hash.slice(1) || "1") - 1, false);
})();</script>
