# Build cpp-splitter and run its ctest suite through CMake RE, on both hosts it supports.
#
# Three jobs: the reference build with plain cmake inside the tipi image, the same through
# cmake-re, and the macOS host build that CLAUDE.md describes -- so what a developer runs on a
# Mac is what CI runs.
#
#   cmake-re-linux-container-build-and-test
#                     cmake-re --host inside tipibuild/tipi-ubuntu-2404:v0.0.87, the job's own
#                     container, with environments/ubuntu-clang.cmake. Same compiler, same
#                     standard and the same 31 fixtures as plain-cmake-build-and-test. Not cmake-re's
#                     containerized mode: from a runner that mode has to push the checkout
#                     into a second container over ssh, and on a shallow checkout of a
#                     private repository the checkout there failed to resolve the commit --
#                     and cmake-re exited 0 on that crash, so the job stayed green. --host
#                     returns the real exit status.
#   cmake-re-macos-host-build-and-test
#                     cmake-re --host with the clang the runner ships, Apple's, and libclang
#                     from Homebrew's llvm (environments/macos-apple-clang.cmake). The
#                     installer does not bring tipi's clang to the runner, so the
#                     tipi-clang toolchain a developer uses locally (macos-clang.cmake) is
#                     not what runs here.
#   plain-cmake-build-and-test
#                     plain cmake through `tipi run` inside the image with
#                     environments/monolithic.cmake -- the reference build.
#
# launcher.remote_split_on_rbe talks to a real RBE cluster. The Linux job hands it the
# RBE_SERVICE, RBE_TLS_CLIENT_AUTH_CERT and RBE_TLS_CLIENT_AUTH_KEY secrets as the variables
# reclient reads; without them (a pull request from a fork gets none) it skips, as it does
# on macOS, where the Linux toolchain it needs is not available. It also skips while the
# image's cmake-re is v0.0.87, which cannot chain the launcher; see the driver.

name: cmake-re

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The release this was validated with; the installer tracks master otherwise.
  TIPI_INSTALL_VERSION: v0.0.87
  # The tipi cache is a shared service the local setup mounts credentials for. CI has
  # neither, so say so rather than letting it try and fail slowly.
  TIPI_CACHE_CONSUME_ONLY: "ON"
  TIPI_CACHE_FORCE_ENABLE: "OFF"
  TIPI_DISABLE_AR_RANLIB_DRIVER: "ON"

jobs:
  cmake-re-linux-container-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: tipibuild/tipi-ubuntu-2404:v0.0.87
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The container runs as root while the checkout is owned by the runner user, which git
      # refuses to look at. cmake-re mirrors the repository, so it has to be allowed.
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      # The image ships cmake-re; this is the version the rest of the job is pinned to.
      - name: Verify CMake RE
        run: |
          cmake-re --version
          ctest-re --version

      # cmake-re's mirror and build trees, Boost included. Keyed on what decides their
      # content; an older entry is still a warm start, cmake-re rebuilds what differs.
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: /usr/local/share/.tipi/v*.w/*/thirdparty/cache
          key: tipi-work-linux-container-${{ hashFiles('CMakeLists.txt', 'environments/**') }}
          restore-keys: |
            tipi-work-linux-container-

      # Downloads hfc and Boost 1.85 through HermeticFetchContent, so this step is where the
      # time goes on a cold run.
      - name: Configure
        run: |
          cmake-re --host -S . -B build/cmake-re-ubuntu-clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=environments/ubuntu-clang.cmake

      - name: Build
        run: cmake-re --build build/cmake-re-ubuntu-clang --host -j$(nproc)

      # For the draft release below. Runs where the image's clang is: it is linked against
      # /usr/local/share/.tipi/clang/4f846ee/lib/libclang.so by rpath.
      - name: Upload cpp-splitter
        uses: actions/upload-artifact@v4
        with:
          name: cpp-splitter-linux-x86_64
          path: build/cmake-re-ubuntu-clang/cpp-splitter
          if-no-files-found: error

      # reclient wants the mTLS pair as files, so the secrets are written out under the
      # runner's temp directory and the RBE_* variables name them. Empty secrets -- a fork's
      # pull request -- write empty files, which are removed again, the variables stay unset
      # and the test skips. (`secrets` cannot be read in a step's `if`, hence the check on
      # the files.)
      - name: Stage RBE credentials
        run: |
          install -d -m 700 "$RUNNER_TEMP/rbe-mtls"
          cat > "$RUNNER_TEMP/rbe-mtls/engflow.crt" <<'EOF_CERT'
          ${{ secrets.RBE_TLS_CLIENT_AUTH_CERT }}
          EOF_CERT
          cat > "$RUNNER_TEMP/rbe-mtls/engflow.key" <<'EOF_KEY'
          ${{ secrets.RBE_TLS_CLIENT_AUTH_KEY }}
          EOF_KEY
          chmod 600 "$RUNNER_TEMP/rbe-mtls/engflow.key"
          if grep -q . "$RUNNER_TEMP/rbe-mtls/engflow.crt" && grep -q . "$RUNNER_TEMP/rbe-mtls/engflow.key"; then
            echo "RBE_tls_client_auth_cert=$RUNNER_TEMP/rbe-mtls/engflow.crt" >> "$GITHUB_ENV"
            echo "RBE_tls_client_auth_key=$RUNNER_TEMP/rbe-mtls/engflow.key" >> "$GITHUB_ENV"
          else
            rm -rf "$RUNNER_TEMP/rbe-mtls"
            echo "no RBE credentials in this run; launcher.remote_split_on_rbe will skip"
          fi

      - name: Test
        env:
          RBE_service: ${{ secrets.RBE_SERVICE }}
        run: ctest-re --test-dir build/cmake-re-ubuntu-clang --output-on-failure -j$(nproc)

      # The fixtures leave their split trees behind, and a failure is usually diagnosed by
      # reading the generated pieces rather than the assertion message.
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-output-linux-container
          path: |
            build/cmake-re-ubuntu-clang/Testing/
            build/cmake-re-ubuntu-clang/test-output/
          retention-days: 7

  cmake-re-macos-host-build-and-test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # cmake-re itself is an x86_64 binary; the installer sets Rosetta up on the arm64
      # runner, a no-op where it is already present.
      - name: Install CMake RE
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/tipi-build/cli/master/install/install_for_macos_linux.sh)"
          cmake-re --version
          ctest-re --version

      # Apple's toolchain has libclang.dylib but not the clang-c/ headers; Homebrew's llvm
      # has both, and the toolchain file asks `brew --prefix llvm` where.
      - name: Install libclang
        run: |
          brew install llvm
          "$(brew --prefix llvm)/bin/clang" --version
          /usr/bin/clang++ --version

      # Same as the Linux job: cmake-re's work tree on the host.
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: /usr/local/share/.tipi/v*.w/*/thirdparty/cache
          key: tipi-work-macos-host-${{ hashFiles('CMakeLists.txt', 'environments/**') }}
          restore-keys: |
            tipi-work-macos-host-

      - name: Configure
        run: |
          cmake-re --host -S . -B build/cmake-re-macos-apple-clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=environments/macos-apple-clang.cmake

      - name: Build
        run: cmake-re --build build/cmake-re-macos-apple-clang --host -j$(sysctl -n hw.ncpu)

      # For the draft release below. arm64, linked against Homebrew's libclang.dylib by rpath.
      - name: Upload cpp-splitter
        uses: actions/upload-artifact@v4
        with:
          name: cpp-splitter-macos-arm64
          path: build/cmake-re-macos-apple-clang/cpp-splitter
          if-no-files-found: error

      - name: Test
        run: ctest-re --test-dir build/cmake-re-macos-apple-clang --output-on-failure -j$(sysctl -n hw.ncpu)

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-output-macos-host
          path: |
            build/cmake-re-macos-apple-clang/Testing/
            build/cmake-re-macos-apple-clang/test-output/
          retention-days: 7

  plain-cmake-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: tipibuild/tipi-ubuntu-2404:v0.0.87
      # The tipi cache is a shared service the local setup mounts credentials for. CI has
      # neither, so say so rather than letting it try and fail slowly.
      env:
        TIPI_CACHE_CONSUME_ONLY: "ON"
        TIPI_CACHE_FORCE_ENABLE: "OFF"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The container runs as root while the checkout is owned by the runner user, which git
      # refuses to look at. Configure reads the revision, so it has to be allowed.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # hfc and Boost, which HermeticFetchContent keeps under thirdparty/cache.
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: thirdparty/cache
          key: thirdparty-cache-plain-cmake-${{ hashFiles('CMakeLists.txt', 'environments/**') }}
          restore-keys: |
            thirdparty-cache-plain-cmake-

      # Downloads hfc and Boost 1.85 through HermeticFetchContent, so this step is where the
      # time goes on a cold run.
      - name: Configure
        run: |
          tipi run cmake -GNinja -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=environments/monolithic.cmake

      - name: Build
        run: tipi run cmake --build build -j$(nproc)

      # 31 fixtures. Each splits a small translation unit through the launcher, compiles the
      # pieces, links them and runs the program, so a failure here is a real defect rather
      # than a flaky environment.
      - name: Test
        run: tipi run ctest --test-dir build --output-on-failure -j$(nproc)

      # The fixtures leave their split trees behind, and a failure is usually diagnosed by
      # reading the generated pieces rather than the assertion message.
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-output
          path: |
            build/Testing/
            build/test-output/
          retention-days: 7

  # One rolling draft release, "main-draft", holding the two binaries of the latest green
  # main. Recreated on every push so it never holds a stale pair; publish it by giving it the
  # tag it should carry and un-drafting it. Pull requests do not get here: they have no
  # write token, and a draft from a branch would be no one's.
  draft-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [cmake-re-linux-container-build-and-test, cmake-re-macos-host-build-and-test, plain-cmake-build-and-test]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cpp-splitter-*
          path: dist

      # download-artifact puts each artifact in a directory of its name; the assets take
      # that name so the two are told apart in the release.
      - name: Lay out the assets
        run: |
          mv dist/cpp-splitter-linux-x86_64/cpp-splitter dist/cpp-splitter-linux-x86_64.bin
          mv dist/cpp-splitter-macos-arm64/cpp-splitter dist/cpp-splitter-macos-arm64.bin
          chmod +x dist/*.bin
          ls -l dist

      - name: Recreate the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.draft and .tag_name == "main-draft") | .id'); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          gh release create main-draft --draft \
            --title "cpp-splitter ${GITHUB_SHA::7} (draft)" \
            --notes "Built from ${GITHUB_SHA} by the cmake-re workflow.

          - cpp-splitter-linux-x86_64.bin: Debug build from tipibuild/tipi-ubuntu-2404:v0.0.87, needs that image's clang at /usr/local/share/.tipi/clang/4f846ee (libclang.so by rpath).
          - cpp-splitter-macos-arm64.bin: Debug build with Apple clang, needs Homebrew llvm (libclang.dylib by rpath).

          Rename the tag before publishing." \
            dist/cpp-splitter-linux-x86_64.bin dist/cpp-splitter-macos-arm64.bin
