# Build cpp-splitter and run its ctest suite.
#
# The job runs inside tipibuild/tipi-ubuntu-2404:v0.0.87 -- the same image the devcontainer
# and the manual `docker run` recipe in CLAUDE.md use. That is not a convenience: the build
# is pinned to one toolchain by environments/monolithic.cmake, which names
# /usr/local/share/.tipi/clang/4f846ee/bin/clang++ by absolute path, and links libc++ and
# libc++abi from the same directory. Those live in the image. Outside it, configure fails at
# the compiler check.
#
# Only the build and the tests run here. The benchmarks and the Boost harness
# (./benchmark-*.sh, ./test-boost-libraries.sh) are deliberately not wired up: they take from
# minutes to hours, need a vendored Boost checkout that is not in this repository, and one of
# them refuses to run at -j32 because that corpus exhausts 122 GiB. They are run by hand and
# their results are written down in benchmarks/.

name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer uninteresting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: tipibuild/tipi-ubuntu-2404:v0.0.87
      # The tipi cache is a shared service the local setup mounts credentials for. CI has
      # neither, so say so rather than letting it try and fail slowly.
      env:
        TIPI_CACHE_CONSUME_ONLY: "ON"
        TIPI_CACHE_FORCE_ENABLE: "OFF"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The container runs as root while the checkout is owned by the runner user, which git
      # refuses to look at. Configure reads the revision, so it has to be allowed.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Downloads hfc and Boost 1.85 through HermeticFetchContent, so this step is where the
      # time goes on a cold run.
      - name: Configure
        run: |
          cmake -GNinja -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=environments/monolithic.cmake

      - name: Build
        run: cmake --build build -j$(nproc)

      # 31 fixtures. Each splits a small translation unit through the launcher, compiles the
      # pieces, links them and runs the program, so a failure here is a real defect rather
      # than a flaky environment.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

      # The fixtures leave their split trees behind, and a failure is usually diagnosed by
      # reading the generated pieces rather than the assertion message.
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-output
          path: |
            build/Testing/
            build/test-output/
          retention-days: 7
